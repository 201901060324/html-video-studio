<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage {
    width:1920px; height:1080px; position:relative;
    background:radial-gradient(120% 90% at 50% 0%, #16304a 0%, #0B1622 62%);
  }
  .grid {
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:96px 96px;
  }
  .wrap { position:absolute; inset:0; padding:110px 120px 74px; display:flex; flex-direction:column; }

  @keyframes rise { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
  @keyframes arrow { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:none; } }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }
  .a { opacity:0; animation:rise .8s cubic-bezier(.22,.9,.3,1) forwards; }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }

  .kicker { font-size:27px; letter-spacing:.2em; color:#7FA6CC; margin-bottom:22px; }
  h2 { font-size:58px; font-weight:600; color:#F4F8FC; line-height:1.26; }

  .compare { margin-top:40px; display:flex; align-items:stretch; gap:30px; }
  .side { flex:1; border-radius:18px; padding:34px 36px 32px; }
  .before { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.10); }
  .after  { background:rgba(95,174,236,.09); border:1px solid rgba(95,174,236,.34); }
  .side .lbl { font-size:24px; letter-spacing:.12em; margin-bottom:22px; }
  .before .lbl { color:#8497AC; }
  .after  .lbl { color:#5FAEEC; }
  .fuzzy { font-size:35px; color:#B8C7D6; line-height:1.55; }
  .rule { font-size:30px; color:#DCEAF6; line-height:1.7; font-family:ui-monospace, "SF Mono", Menlo, monospace; }
  .rule b { color:#F0C65E; font-weight:600; }
  .note { margin-top:20px; font-size:22px; color:#7C93A8; }

  .mid { display:flex; align-items:center; color:#F2915C; font-size:44px; padding:0 4px; }

  .noteBar {
    margin-top:38px; padding:28px 34px; border-radius:14px;
    background:rgba(240,198,94,.10); border-left:5px solid #F0C65E;
    font-size:27px; color:#F3E3BC; line-height:1.6;
  }
  .foot { margin-top:auto; padding-top:24px; font-size:22px; color:#5F738A; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <div class="kicker a" style="animation-delay:.05s">02 · 核心：不是摘抄，是翻译</div>
    <h2 class="a" style="animation-delay:.18s">把"凭感觉"翻成能检索的条件</h2>

    <div class="compare">
      <div class="side before a" style="animation-delay:.4s">
        <div class="lbl">原文 · 口语表达</div>
        <div class="fuzzy">"量能不足要谨慎"</div>
        <div class="note">换个说法就找不到了，无法判断、无法复用</div>
      </div>

      <div class="mid a" style="animation-delay:.6s">→</div>

      <div class="side after a" style="animation-delay:.74s">
        <div class="lbl">整理后 · 结构化规则</div>
        <div class="rule">IF 微盘股跌 <b>&gt;= 3%</b><br>
          AND 跌停家数 <b>&gt; 30</b><br>
          AND 上证跌 <b>&gt; 2%</b><br>
          THEN 视为短期情绪冰点</div>
      </div>
    </div>

    <div class="noteBar a" style="animation-delay:1.0s">
      <b>注意：</b>这是"能写成代码"，不是"验证有效"。整个项目<b style="color:#F2915C">没有做过回测</b>，
      这些数字阈值准不准，目前是未知数。
    </div>
    <div class="foot">规则观点归原作者所有 · AI 仅做整理、翻译与结构化 · 不构成投资建议</div>
  </div>
</div>
</body>
</html>
