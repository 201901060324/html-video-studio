<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage {
    width:1920px; height:1080px; position:relative;
    background:radial-gradient(120% 90% at 50% 0%, #16304a 0%, #0B1622 62%);
  }
  .grid {
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:96px 96px;
  }
  .wrap { position:absolute; inset:0; padding:110px 120px 74px; display:flex; flex-direction:column; }

  @keyframes rise { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }
  .a { opacity:0; animation:rise .8s cubic-bezier(.22,.9,.3,1) forwards; }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }

  .kicker { font-size:27px; letter-spacing:.2em; color:#7FA6CC; margin-bottom:22px; }
  h2 { font-size:58px; font-weight:600; color:#F4F8FC; line-height:1.26; }

  .gap {
    margin-top:40px; padding:32px 38px; border-radius:16px;
    background:rgba(242,145,92,.09); border-left:5px solid #F2915C;
  }
  .gap .t { font-size:31px; color:#F6D9C2; margin-bottom:14px; }
  .gap .d { font-size:27px; color:#D6C4B4; line-height:1.6; }

  .rows { margin-top:36px; display:flex; flex-direction:column; gap:22px; }
  .r { display:flex; gap:24px; align-items:flex-start; }
  .ic {
    flex-shrink:0; width:52px; height:52px; border-radius:14px; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:27px;
    background:rgba(95,174,236,.14); border:1px solid rgba(95,174,236,.4); color:#5FAEEC;
  }
  .r .tx { font-size:28px; color:#C9D6E2; line-height:1.6; }
  .r .tx b { color:#F0C65E; font-weight:600; }

  .fix {
    margin-top:auto; padding:30px 38px; border-radius:16px;
    background:rgba(120,200,140,.10); border:1px solid rgba(120,200,140,.36);
    font-size:28px; color:#CDE8D6; line-height:1.6;
  }
  .fix b { color:#8FDCA8; font-weight:600; }
  .foot { margin-top:22px; font-size:22px; color:#5F738A; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <div class="kicker a" style="animation-delay:.05s">05 · 这个方法的固有缺陷</div>
    <h2 class="a" style="animation-delay:.18s">AI 整理，一定会有错</h2>

    <div class="gap a" style="animation-delay:.38s">
      <div class="t">素材覆盖有硬缺口：2024 年 1–7 月完全空白</div>
      <div class="d">79 场素材里，2024 年只有 6 场，全在 8–10 月。年初那波极端行情，他当时怎么应对的，这套规则基本没覆盖。</div>
    </div>

    <div class="rows">
      <div class="r a" style="animation-delay:.58s">
        <div class="ic">⚠</div>
        <div class="tx">AI 可能<b>曲解原意</b>，把带限定条件的话绝对化</div>
      </div>
      <div class="r a" style="animation-delay:.72s">
        <div class="ic">⚠</div>
        <div class="tx">可能<b>过度归纳</b>，把一次性的说法当成长期规则</div>
      </div>
      <div class="r a" style="animation-delay:.86s">
        <div class="ic">⚠</div>
        <div class="tx">有些规则可能是 AI <b>凭空推断</b>的，而非作者真实表达</div>
      </div>
    </div>

    <div class="fix a" style="animation-delay:1.0s">
      <b>所以：发现哪条规则跟原文对不上，一定以原文为准。</b>
      欢迎直接提 issue 纠正——这套东西只有被人挑刺才会变靠谱。
    </div>
    <div class="foot">另有 3 章因原始素材来源权限待核，公开版仅留占位</div>
  </div>
</div>
</body>
</html>
