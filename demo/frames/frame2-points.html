<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>frame 2 · points</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Helvetica Neue", "Inter", system-ui, sans-serif;
    background: #0b0b0f; color: #f5f5f7;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 180px; position: relative;
  }
  .kicker {
    font-size: 30px; letter-spacing: 0.34em; color: #ff5a2c;
    text-transform: uppercase; margin-bottom: 62px;
    animation: fadeUp .8s cubic-bezier(.22,1,.36,1) .1s both;
  }
  .row { display: flex; align-items: baseline; gap: 44px; padding: 34px 0; border-bottom: 1px solid #1e1e26; }
  .num { font-size: 30px; font-weight: 700; color: #ff5a2c; width: 74px; flex: none; }
  .h { font-size: 66px; font-weight: 700; letter-spacing: -0.01em; width: 420px; flex: none; }
  .d { font-size: 34px; color: #8d8d99; line-height: 1.5; }
  .r1 { animation: slideIn .85s cubic-bezier(.22,1,.36,1) .35s both; }
  .r2 { animation: slideIn .85s cubic-bezier(.22,1,.36,1) .6s both; }
  .r3 { animation: slideIn .85s cubic-bezier(.22,1,.36,1) .85s both; }
  .tag {
    margin-top: 66px; display: inline-block; align-self: flex-start;
    font-size: 30px; color: #0b0b0f; background: #ff5a2c;
    padding: 14px 30px; border-radius: 999px; font-weight: 600;
    animation: pop .7s cubic-bezier(.34,1.56,.64,1) 1.25s both;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-52px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <div class="kicker">Why it wins</div>
  <div class="row r1">
    <div class="num">01</div>
    <div class="h">确定性</div>
    <div class="d">画面由代码决定，不是模型抽样 —— 同样的输入永远得到同样的输出</div>
  </div>
  <div class="row r2">
    <div class="num">02</div>
    <div class="h">可复现</div>
    <div class="d">帧是 HTML，能进 Git、能 review，改一句文案重渲一版</div>
  </div>
  <div class="row r3">
    <div class="num">03</div>
    <div class="h">零 GPU</div>
    <div class="d">Chromium 录制 + ffmpeg 编码，笔记本 CPU 即可，无按次计费</div>
  </div>
  <div class="tag">扩散模型给不了这三件事</div>
</body>
</html>
