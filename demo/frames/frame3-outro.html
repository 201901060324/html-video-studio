<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>frame 3 · outro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Helvetica Neue", "Inter", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 45%, #171331 0%, #08080c 70%);
    color: #f5f5f7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .mark { width: 150px; height: 150px; position: relative; margin-bottom: 54px; }
  .bar { position: absolute; background: #7c5cff; border-radius: 3px; }
  .b1 { left: 22px;  top: 14px;  width: 24px; height: 122px; animation: piece 1s cubic-bezier(.34,1.56,.64,1) .1s both; }
  .b2 { right: 22px; top: 14px;  width: 24px; height: 122px; animation: piece 1s cubic-bezier(.34,1.56,.64,1) .2s both; }
  .b3 { left: 34px;  top: 66px;  width: 82px; height: 22px; animation: piece 1s cubic-bezier(.34,1.56,.64,1) .3s both; }
  .brand { font-size: 96px; font-weight: 800; letter-spacing: -0.02em; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .75s both; }
  .brand em { font-style: normal; color: #7c5cff; }
  .line { margin-top: 34px; font-size: 38px; color: #8d8d99; letter-spacing: 0.04em; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) 1s both; }
  .stack { margin-top: 62px; display: flex; gap: 26px; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) 1.3s both; }
  .chip { font-size: 27px; padding: 13px 26px; border: 1px solid #2c2c3a; border-radius: 999px; color: #b9b9c6; background: rgba(255,255,255,0.03); }
  .foot { position: absolute; bottom: 74px; font-size: 25px; color: #4e4e58; letter-spacing: 0.2em; animation: fadeUp .8s ease-out 1.6s both; }
  @keyframes piece { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="mark">
    <div class="bar b1"></div>
    <div class="bar b2"></div>
    <div class="bar b3"></div>
  </div>
  <div class="brand">改一句话，<em>重渲一版</em></div>
  <div class="line">本地渲染 · Apache-2.0 · 无按次收费</div>
  <div class="stack">
    <span class="chip">Remotion</span>
    <span class="chip">html-video</span>
    <span class="chip">PPTX → MP4</span>
    <span class="chip">Chromium + ffmpeg</span>
  </div>
  <div class="foot">2026 · 程序化视频</div>
</body>
</html>
