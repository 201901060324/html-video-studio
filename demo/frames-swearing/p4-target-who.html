<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden; background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { width:1920px; height:1080px; position:relative;
    background:radial-gradient(130% 95% at 15% 10%, #1c2f42 0%, #0B1622 62%); }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px);
    background-size:96px 96px; }
  .wrap { position:absolute; inset:0; padding:104px 120px 70px;
    display:flex; flex-direction:column; }

  @keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
  @keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .a { opacity:0; animation:rise .85s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }

  h1 { font-size:64px; font-weight:600; color:#F4F8FC; line-height:1.16; }
  h1 .hl { color:#F0C65E; }
  .rule { margin-top:22px; height:3px; width:230px; background:#3E7FB8; transform-origin:left center; flex:none;
    animation:growX .9s cubic-bezier(.22,.9,.3,1) forwards; }

  .pair { margin-top:56px; display:flex; gap:0; align-items:stretch; }
  .bx { flex:1; border-radius:20px; padding:40px 42px 38px;
    border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.035); }
  .bx.en { background:rgba(95,174,236,.085); border-color:rgba(95,174,236,.26); }
  .bx.cn { background:rgba(242,145,92,.085); border-color:rgba(242,145,92,.26); }
  .bx .lb { font-size:25px; letter-spacing:.16em; margin-bottom:24px; }
  .bx.en .lb { color:#8FC2EE; } .bx.cn .lb { color:#F6B183; }
  .bx .big { font-size:52px; font-weight:600; line-height:1.3; }
  .bx.en .big { color:#E9F1F8; } .bx.cn .big { color:#F7EDE4; }
  .bx .big .dim { color:#7E93A8; }
  .bx .ds { margin-top:26px; font-size:25px; color:#93A8BC; line-height:1.62; }
  .bx .tg { display:inline-block; margin-top:24px; font-size:23px; padding:9px 20px; border-radius:9px;
    background:rgba(255,255,255,.07); color:#C3D6E6; }

  .vs { flex:none; width:120px; display:flex; align-items:center; justify-content:center;
    font-size:34px; color:#F0C65E; letter-spacing:.1em; }

  .band { margin-top:auto; padding:26px 36px; border-radius:16px;
    background:rgba(240,198,94,.10); border:1px solid rgba(240,198,94,.26);
    display:flex; align-items:center; gap:24px; }
  .band .k { font-size:24px; letter-spacing:.14em; color:#F0C65E; flex:none;
    border-right:1px solid rgba(240,198,94,.3); padding-right:22px; }
  .band .v { font-size:30px; color:#F2E6C8; font-weight:500; }
  .foot { margin-top:24px; font-size:22px; color:#5F738A; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <h1 class="a" style="animation-delay:.1s">差异二 · 攻击的<span class="hl">落点</span>不一样</h1>
    <div class="rule" style="animation-delay:.3s"></div>

    <div class="pair">
      <div class="bx en a" style="animation-delay:.5s">
        <div class="lb">英语的句式</div>
        <div class="big">你<span class="dim">是个</span>■■■</div>
        <div class="ds">主语永远是"你"。<br>攻击的是你此刻的属性、行为、智力、人格 —— 也就是<strong>当下的你</strong>。</div>
        <div class="tg">落点：状态 · 可反驳 · 可和解</div>
      </div>

      <div class="vs a" style="animation-delay:.65s">VS</div>

      <div class="bx cn a" style="animation-delay:.62s">
        <div class="lb">中文的句式</div>
        <div class="big">我问候<span class="dim">你的</span>■■■■</div>
        <div class="ds">宾语是"你的父母、祖先、后代"。<br>攻击的是把你造出来的那条链条 —— 也就是<strong>你的来路</strong>。</div>
        <div class="tg">落点：血统 · 不可反驳 · 无法和解</div>
      </div>
    </div>

    <div class="band a" style="animation-delay:.85s">
      <div class="k">为什么</div>
      <div class="v">在宗族社会里，一个人的价值由他所属的家族定义 —— 所以攻击家族，才等于攻击他本人</div>
    </div>
    <div class="foot">句式已作改写 · 未使用任何完整原词</div>
  </div>
</div>
</body>
</html>
