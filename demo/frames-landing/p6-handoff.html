<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing:antialiased; }
  .stage { width:1920px; height:1080px; position:relative;
    background:radial-gradient(130% 90% at 50% 0%, #10304a 0%, #0B1622 58%); }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:96px 96px; }
  .wrap { position:absolute; inset:0; padding:100px 120px 100px; display:flex; flex-direction:column; }

  @keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
  @keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes wipe { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
  .a { opacity:0; animation:rise .85s cubic-bezier(.22,.9,.3,1) forwards; }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }

  .tag { display:inline-block; align-self:flex-start; font-size:25px; letter-spacing:.22em; color:#7FA6CC;
    border:1px solid rgba(127,166,204,.4); border-radius:999px; padding:11px 28px; margin-bottom:26px; }
  h1 { font-size:68px; font-weight:600; color:#F4F8FC; line-height:1.16; }
  .rule { margin-top:24px; height:3px; width:260px; background:#3E7FB8; transform-origin:left center;
    animation:growX .9s cubic-bezier(.22,.9,.3,1) forwards; flex:none; }

  .chart { margin-top:30px; position:relative; height:428px; flex:none; border-radius:22px;
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); }
  svg.chartSvg { position:absolute; left:40px; top:22px; }
  .lg { position:absolute; left:44px; bottom:20px; display:flex; gap:34px; }
  .lg .it { display:flex; align-items:center; gap:12px; font-size:23px; color:#C6D5E2; white-space:nowrap; }
  .lg .sw { width:30px; height:12px; border-radius:3px; }
  .lg .it.g .sw { background:#F0C65E; }
  .lg .it.o .sw { background:#F2915C; }

  .sum { margin-top:auto; display:flex; gap:32px; flex:none; }
  .bx { flex:1; padding:18px 28px; border-radius:18px; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09); }
  .bx .t { font-size:24px; color:#A8BCCD; margin-bottom:10px; letter-spacing:.04em; }
  .bx .n { font-size:32px; font-weight:600; color:#FFFFFF; font-variant-numeric:tabular-nums; line-height:1.18; }
  .bx .n .g { color:#F2C55C; } .bx .n .o { color:#F2915C; } .bx .n .r { color:#7FD4C0; }
  .bx .d { margin-top:6px; font-size:21px; color:#8497AC; line-height:1.4; }
  .bx.hi { background:rgba(242,145,92,.10); border-color:rgba(242,145,92,.28); }
  .foot { position:absolute; left:120px; bottom:34px; font-size:22px; color:#5F738A; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <div class="tag a" style="animation-delay:.05s">三套系统的接力</div>
    <h1 class="a" style="animation-delay:.2s">谁在出力？刹车和空气的分工</h1>
    <div class="rule" style="animation-delay:.4s"></div>

    <div class="chart a" style="animation-delay:.56s">
      <div class="lg">
        <div class="it g"><span class="sw"></span>扰流板 + 气动阻力 + 发动机反推</div>
        <div class="it o"><span class="sw"></span>机轮刹车</div>
      </div>
      <svg class="chartSvg" width="1560" height="380" viewBox="0 0 1690 392">
        <!-- 区间底色 -->
        <rect x="0" y="26" width="1264" height="252" fill="#8FC2EE" opacity=".045"/>
        <rect x="1264" y="26" width="426" height="252" fill="#F2915C" opacity=".045"/>

        <!-- 50% 基准线 -->
        <line x1="0" y1="152" x2="1690" y2="152" stroke="rgba(255,255,255,.20)" stroke-width="1.5" stroke-dasharray="7 7"/>
        <text x="6" y="174" fill="#8C9EAF" font-size="19">各占一半</text>

        <!-- 区间标题 -->
        <text x="632" y="56" fill="#7FA6CC" font-size="25" font-weight="600" text-anchor="middle">高速滑跑段</text>
        <text x="1477" y="56" fill="#F0A88E" font-size="25" font-weight="600" text-anchor="middle">低速滑跑段</text>

        <!-- 上层：气动 + 反推（从顶向下） -->
        <path d="M0 26 L0 160 L422 152 L844 144 L1264 134 L1477 88 L1690 38 L1690 26 Z"
              fill="#F0C65E" opacity=".55" style="clip-path:inset(0 100% 0 0); animation:wipe 1.1s ease .8s forwards;"/>
        <!-- 下层：机轮刹车 -->
        <path d="M0 160 L422 152 L844 144 L1264 134 L1477 88 L1690 38 L1690 278 L0 278 Z"
              fill="#F2915C" opacity=".62" style="clip-path:inset(0 100% 0 0); animation:wipe 1.1s ease .95s forwards;"/>
        <!-- 交界线 -->
        <path d="M0 160 L422 152 L844 144 L1264 134 L1477 88 L1690 38"
              fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".6"
              style="clip-path:inset(0 100% 0 0); animation:wipe 1.1s ease 1.1s forwards;"/>

        <!-- 层内文字 -->
        <g opacity="0" style="animation:fadeIn .5s ease 1.4s both;">
          <text x="200" y="100" fill="#F7DFA4" font-size="26" font-weight="600">空气在干活</text>
          <text x="200" y="132" fill="#D9BC72" font-size="22">扰流板 + 反推占 35–55%</text>
        </g>
        <g opacity="0" style="animation:fadeIn .5s ease 1.55s both;">
          <text x="200" y="212" fill="#FBD2BC" font-size="26" font-weight="600">刹车只出一部分力</text>
          <text x="200" y="244" fill="#DE9C7E" font-size="22">省着用，避免刹车过热</text>
        </g>
        <g opacity="0" style="animation:fadeIn .5s ease 1.7s both;">
          <text x="1300" y="208" fill="#FBD2BC" font-size="26" font-weight="600">刹车包场</text>
          <text x="1300" y="240" fill="#DE9C7E" font-size="22">80–95%，气动几乎归零</text>
        </g>

        <!-- 交点 -->
        <g opacity="0" style="animation:fadeIn .5s ease 1.85s both;">
          <line x1="1264" y1="26" x2="1264" y2="278" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 7" opacity=".6"/>
          <circle cx="1264" cy="134" r="10" fill="#FFFFFF"/>
          <text x="1300" y="104" fill="#FFFFFF" font-size="24" font-weight="600">≈ 100 km/h</text>
          <text x="1300" y="134" fill="#9BB4CC" font-size="21">刹车开始反超</text>
        </g>

        <!-- 速度轴 -->
        <line x1="0" y1="278" x2="1690" y2="278" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
        <g fill="#7FA6CC" font-size="22" text-anchor="middle">
          <text x="26" y="314">250</text><text x="440" y="314">200</text><text x="852" y="314">150</text>
          <text x="1264" y="314">100</text><text x="1650" y="314">0</text>
        </g>
        <text x="845" y="380" fill="#7FA6CC" font-size="22" text-anchor="middle">km/h</text>
        <text x="845" y="352" fill="#5F738A" font-size="22" text-anchor="middle">飞机滑跑速度（从左到右越来越慢）</text>
      </svg>
    </div>

    <div class="sum">
      <div class="bx a" style="animation-delay:2.0s">
        <div class="t">250 → 100 km/h · 空气为主</div>
        <div class="n"><span class="g">35–55%</span> 来自扰流板 + 反推</div>
        <div class="d">此时气动效率最高，刹车只需要出一部分力</div>
      </div>
      <div class="bx hi a" style="animation-delay:2.12s">
        <div class="t">100 → 0 km/h · 刹车为主</div>
        <div class="n"><span class="o">80–95%</span> 全部由刹车承担</div>
        <div class="d">速度一低，空气阻力按速度平方急剧衰减，撑不住了</div>
      </div>
      <div class="bx a" style="animation-delay:2.24s">
        <div class="t">所以驾驶策略是</div>
        <div class="n"><span class="r">早用气动 · 晚点重刹</span></div>
        <div class="d">先把速度压下来，再逐步加大刹车力</div>
      </div>
    </div>

    <div class="foot">数据来源：波音《Landing on slippery runways》技术简报（干跑道可用总减速能力约 0.5 g，此处已归一化为占比）</div>
  </div>
</div>
</body>
</html>
