<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden; background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { width:1920px; height:1080px; position:relative;
    background:radial-gradient(130% 90% at 15% 0%, #3d2410 0%, #0B1622 58%); }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:96px 96px; }
  .wrap { position:absolute; inset:0; padding:106px 120px 126px;
    display:flex; flex-direction:column; }

  @keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
  @keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .a { opacity:0; animation:rise .85s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }

  .tag { display:inline-block; align-self:flex-start; font-size:26px; letter-spacing:.22em; color:#E8B083;
    border:1px solid rgba(232,176,131,.4); border-radius:999px; padding:12px 30px; margin-bottom:40px; }
  h1 { font-size:82px; font-weight:600; color:#F4F8FC; line-height:1.16; }
  .rule { margin-top:32px; height:3px; width:260px; background:#E8834A; transform-origin:left center;
    animation:growX .9s cubic-bezier(.22,.9,.3,1) forwards; flex:none; }

  .grid2 { margin-top:48px; display:grid; grid-template-columns:1fr 1fr; gap:24px 42px; }
  .stat { padding:28px 34px; border-radius:18px;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.10); }
  .stat .v { font-size:54px; font-weight:600; color:#FFFFFF; font-variant-numeric:tabular-nums; line-height:1.08; }
  .stat .v span { font-size:30px; color:#C9D8E8; font-weight:400; }
  .stat .l { margin-top:13px; font-size:25px; color:#9BB4CC; line-height:1.45; }
  .stat.hot { background:rgba(232,131,74,.14); border-color:rgba(232,131,74,.34); }
  .stat.hot .v { color:#F6A469; }

  .verdict { margin-top:auto; padding:32px 48px; border-radius:20px;
    background:rgba(242,145,92,.14); border:1px solid rgba(242,145,92,.4); }
  .verdict .k { font-size:23px; letter-spacing:.2em; color:#E8A87C; margin-bottom:12px; }
  .verdict .s { font-size:38px; font-weight:600; color:#FFFFFF; line-height:1.38; }
  .foot { position:absolute; left:120px; bottom:42px; font-size:22px; color:#5F738A; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <div class="tag a" style="animation-delay:.05s">城乡居民 · 1.88 亿人在领</div>
    <h1 class="a" style="animation-delay:.2s">比韩国更极端的版本</h1>
    <div class="rule" style="animation-delay:.4s"></div>

    <div class="grid2">
      <div class="stat a" style="animation-delay:.56s">
        <div class="v">2009 <span>年才试点</span></div>
        <div class="l">新农保起步 · 制度至今仅十七年</div>
      </div>
      <div class="stat hot a" style="animation-delay:.66s">
        <div class="v">163 <span>元/月</span></div>
        <div class="l">2026 年全国基础养老金最低标准</div>
      </div>
      <div class="stat hot a" style="animation-delay:.76s">
        <div class="v">75%+ <span>仍在劳作</span></div>
        <div class="l">约 8000–9000 万农村老人未真正退出劳动</div>
      </div>
      <div class="stat a" style="animation-delay:.86s">
        <div class="v">40% <span>收入替代率</span></div>
        <div class="l">城镇为 88% · 农村年支出约 6734 元</div>
      </div>
    </div>

    <div class="verdict a" style="animation-delay:1s">
      <div class="k">性质判断</div>
      <div class="s">个人账户几乎为空，到手基本全是财政补贴 —— 它不是保险，是定额转移支付</div>
    </div>

    <div class="foot">数据来源：人社部 · 民政部《2025 年度国家老龄事业发展公报》· 两会代表调研数据</div>
  </div>
</div>
</body>
</html>
