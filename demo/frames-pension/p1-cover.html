<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage {
    width:1920px; height:1080px; position:relative;
    background:radial-gradient(120% 90% at 50% 0%, #16304a 0%, #0B1622 62%);
  }
  .grid {
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:96px 96px;
  }
  .wrap { position:absolute; inset:0; padding:130px 120px; }

  @keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
  @keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes pop { from { opacity:0; transform:scale(.86); } to { opacity:1; transform:none; } }
  .a { opacity:0; animation:rise .85s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }

  .tag {
    display:inline-block; font-size:26px; letter-spacing:.22em; color:#7FA6CC;
    border:1px solid rgba(127,166,204,.36); border-radius:999px;
    padding:12px 30px; margin-bottom:54px;
  }
  h1 {
    font-size:104px; font-weight:600; color:#F4F8FC; letter-spacing:.02em; line-height:1.16;
  }
  .sub { margin-top:34px; font-size:40px; color:#9BB4CC; font-weight:300; letter-spacing:.04em; }
  .rule {
    margin-top:52px; height:3px; width:300px; background:#3E7FB8; transform-origin:left center;
    animation:growX .9s cubic-bezier(.22,.9,.3,1) forwards;
  }

  .row { position:absolute; left:120px; right:120px; bottom:150px; display:flex; gap:44px; }
  .cell {
    flex:1; padding:38px 40px 34px; border-radius:18px;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.10);
  }
  .cell .cn { font-size:30px; color:#9BB4CC; margin-bottom:22px; letter-spacing:.06em; }
  .cell .cv { font-size:74px; font-weight:600; color:#FFFFFF; font-variant-numeric:tabular-nums; line-height:1; }
  .cell .cd { margin-top:16px; font-size:24px; color:#8497AC; }
  .k .cv { color:#F2915C; } .j .cv { color:#5FAEEC; } .c .cv { color:#F0C65E; }

  .foot { position:absolute; left:120px; bottom:74px; font-size:23px; color:#5F738A; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <div class="tag a" style="animation-delay:.05s">养老金观察 · 2026</div>
    <h1 class="a" style="animation-delay:.22s">老人为什么还在工作？</h1>
    <div class="sub a" style="animation-delay:.42s">日韩的答案，和中国的处境</div>
    <div class="rule" style="animation-delay:.6s"></div>
  </div>

  <div class="row">
    <div class="cell k a" style="animation-delay:.78s">
      <div class="cn">韩国 66 岁以上</div>
      <div class="cv">39.7%</div>
      <div class="cd">收入贫困率 · OECD 第一</div>
    </div>
    <div class="cell j a" style="animation-delay:.92s">
      <div class="cn">日本 65 岁以上</div>
      <div class="cv">943 万</div>
      <div class="cd">仍在工作 · 连续 22 年上升</div>
    </div>
    <div class="cell c a" style="animation-delay:1.06s">
      <div class="cn">中国农村老龄</div>
      <div class="cv">75%+</div>
      <div class="cd">有劳动能力者仍在劳作</div>
    </div>
  </div>

  <div class="foot">数据来源：韩国统计厅 · 日本总务省 · 人社部 · 民政部《2025 年度国家老龄事业发展公报》</div>
</div>
</body>
</html>
