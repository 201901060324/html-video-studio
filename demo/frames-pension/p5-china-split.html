<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden; background:#0B1622;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { width:1920px; height:1080px; position:relative;
    background:radial-gradient(130% 90% at 20% 0%, #3a2a0c 0%, #0B1622 58%); }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:96px 96px; }
  .wrap { position:absolute; inset:0; padding:102px 120px 122px;
    display:flex; flex-direction:column; }

  @keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
  @keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes barIn { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .a { opacity:0; animation:rise .85s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes aiIn { from { opacity:0; } to { opacity:1; } }
  .aibadge { position:absolute; right:56px; top:44px; z-index:5; font-size:26px; letter-spacing:.08em;
    color:#FFFFFF; padding:11px 22px; border-radius:8px; background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.30); opacity:0; animation:aiIn .5s ease .15s forwards; }

  .tag { display:inline-block; align-self:flex-start; font-size:26px; letter-spacing:.22em; color:#E4C57E;
    border:1px solid rgba(228,197,126,.4); border-radius:999px; padding:12px 30px; margin-bottom:36px; }
  h1 { font-size:80px; font-weight:600; color:#F4F8FC; line-height:1.16; }
  .rule { margin-top:30px; height:3px; width:260px; background:#E0BC62; transform-origin:left center;
    animation:growX .9s cubic-bezier(.22,.9,.3,1) forwards; flex:none; }

  .bars { margin-top:44px; }
  .bar { display:flex; align-items:center; gap:34px; margin-bottom:22px; height:92px; }
  .bar .nm { width:280px; font-size:30px; color:#E3EDF6; font-weight:500; flex:none; }
  .bar .tr { flex:1; height:92px; border-radius:12px; background:rgba(255,255,255,.05);
    position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.07); }
  .bar .fi { position:absolute; left:0; top:0; bottom:0; border-radius:12px;
    transform-origin:left center; }
  .bar .vb { width:240px; flex:none; display:flex; align-items:baseline; gap:10px; }
  .bar .vb .n { font-size:48px; font-weight:600; color:#FFFFFF; font-variant-numeric:tabular-nums; }
  .bar .vb .u { font-size:25px; color:#9BB4CC; }
  .b1 .fi { background:linear-gradient(90deg,#7FB6E8,#4E90CC); width:100%; }
  .b2 .fi { background:linear-gradient(90deg,#8FC2EE,#3E7FB8); width:60%; }
  .b3 .fi { background:linear-gradient(90deg,#F0C65E,#E2915C); width:4%; min-width:14px; }
  .cap { margin-top:8px; margin-bottom:16px; font-size:23px; color:#8C7F63; padding-left:314px; }

  .cmp { margin-top:auto; display:flex; gap:44px; align-items:stretch; }
  .side { flex:1; padding:28px 40px; border-radius:20px; border:1px solid rgba(255,255,255,.10); }
  .side.u { background:rgba(127,182,232,.10); border-color:rgba(127,182,232,.26); }
  .side.r { background:rgba(242,198,94,.10); border-color:rgba(242,198,94,.26); }
  .side .t { font-size:26px; color:#A8BCCD; margin-bottom:16px; }
  .side .n { font-size:58px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1; }
  .side.u .n { color:#8FC2EE; } .side.r .n { color:#F2C55C; }
  .side .d { margin-top:12px; font-size:23px; color:#8497AC; }
  .gap { flex:none; display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:0 24px; }
  .gap .n { font-size:68px; font-weight:600; color:#F2915C; font-variant-numeric:tabular-nums; }
  .gap .l { margin-top:8px; font-size:24px; color:#9BB4CC; }
  .foot { position:absolute; left:120px; bottom:40px; font-size:22px; color:#5F738A; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="aibadge">本视频含 AI 生成内容</div>
  <div class="wrap">
    <div class="tag a" style="animation-delay:.05s">中国 · 2025</div>
    <h1 class="a" style="animation-delay:.2s">同一个国家，两个数量级</h1>
    <div class="rule" style="animation-delay:.4s"></div>

    <div class="bars">
      <div class="bar b1 a" style="animation-delay:.56s">
        <div class="nm">机关事业退休</div>
        <div class="tr"><div class="fi" style="animation:barIn .9s cubic-bezier(.22,.9,.3,1) .7s forwards; transform:scaleX(0)"></div></div>
        <div class="vb"><span class="n">6195</span><span class="u">元/月</span></div>
      </div>
      <div class="bar b2 a" style="animation-delay:.66s">
        <div class="nm">企业职工退休</div>
        <div class="tr"><div class="fi" style="animation:barIn .9s cubic-bezier(.22,.9,.3,1) .8s forwards; transform:scaleX(0)"></div></div>
        <div class="vb"><span class="n">3688</span><span class="u">元/月</span></div>
      </div>
      <div class="bar b3 a" style="animation-delay:.76s">
        <div class="nm">城乡居民养老</div>
        <div class="tr"><div class="fi" style="animation:barIn .8s cubic-bezier(.22,.9,.3,1) .9s forwards; transform:scaleX(0)"></div></div>
        <div class="vb"><span class="n">193</span><span class="u">元/月</span></div>
      </div>
      <div class="cap a" style="animation-delay:1s">同一省份同一年 · 云南省人社部门公开口径</div>
    </div>

    <div class="cmp">
      <div class="side u a" style="animation-delay:1.1s">
        <div class="t">全国城镇职工月均</div>
        <div class="n">3498 元</div>
        <div class="d">参保 5.47 亿人</div>
      </div>
      <div class="gap a" style="animation-delay:1.2s">
        <div class="n">12×</div>
        <div class="l">差距</div>
      </div>
      <div class="side r a" style="animation-delay:1.3s">
        <div class="t">全国城乡居民月均</div>
        <div class="n">287 元</div>
        <div class="d">领取 1.88 亿人</div>
      </div>
    </div>

    <div class="foot">数据来源：人社部 · 民政部、全国老龄办《2025 年度国家老龄事业发展公报》</div>
  </div>
</div>
</body>
</html>
